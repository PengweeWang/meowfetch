[package]
name = "meowfetch"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A simple and lightweight system information fetch tool with cute cat logos"
license = "MIT"
repository = "https://github.com/PengweeWang/meowfetch"
keywords = ["fetch", "system-info", "neofetch", "sysinfo"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
dirs = "5.0"
sysinfo = "0.33"
whoami = "1.5"

[profile.release]
opt-level = 3
strip = true
lto = true